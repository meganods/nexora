name: urbanuser
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  firebase_auth: ^6.3.0
  cloud_firestore: ^6.2.0
  provider: ^6.1.5+1
  image_picker: ^1.2.1
  geolocator: ^14.0.2
  permission_handler: ^12.0.1
  geocoding: ^4.0.0
  google_maps_flutter: ^2.17.0
  firebase_core: ^4.6.0
  flutter_dotenv: ^6.0.0
  firebase_storage: ^13.2.0
  cloudinary_public: ^0.23.1
  lucide_icons: ^0.257.0
  url_launcher: ^6.3.0
  flutter_animate: ^4.5.2
  cached_network_image: ^3.4.1
  intl: ^0.20.2
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/
    - assets/images/categories/
    - assets/images/promotions/
    - assets/images/vendors/
